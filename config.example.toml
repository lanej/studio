[display]
inline_diagnostics = true
# Minimum code columns per side, excluding line numbers and the divider.
min_split_columns = 40

# Optional RGB backgrounds for changed rows or split cells.
# added_background = "#304639"
# removed_background = "#47343f"

# Global lead shortcuts are opt-in. For example, set openPicker to a free chord
# to open the picker while drafting. Run /reload in Pi to apply changes.
# Each action takes a Pi key name, an array of aliases, or [] to disable it.
[keybindings.lead]
openPicker = []
openWorkers = []
openTasks = []
toggleStatus = []

[keybindings.picker]
workers = "w"
tasks = "t"
status = "s"

[keybindings.pane]
up = ["up", "k"]
down = ["down", "j"]
activate = "enter"
close = ["escape", "ctrl+c"]
pageUp = "pageUp"
pageDown = "pageDown"
focusWorker = "right"

[keybindings.tasks]
back = "left"
refresh = "r"
nextLink = "tab"
previousLink = "shift+tab"
quit = "q"

# Question scrolling in the multiline answer editor. Text editing uses Pi's
# own keybindings.json, including tui.input.submit, tui.input.newLine, and tui.select.cancel.
[keybindings.decision]
pageUp = "pageUp"
pageDown = "pageDown"

# Managed explorers and reviewers are enabled for an eligible lead.
# To opt out, uncomment both lines.
# [delegation]
# enabled = false

# Open specification and plan documents beside Studio when both integrations are enabled.
[integrations.neovim]
enabled = false
executable = "nvim"

[integrations.zellij]
enabled = false
executable = "zellij"

# Unattended execution is disabled until explicitly configured and enrolled.
[runtime]
enabled = false
concurrency = 2
pollMs = 5000

# [[runtime.projects]]
# root = "/absolute/path/to/project"
# profile = "personal"
# base = "origin/main"
# merge = false
# beadsWorkspace = "/absolute/path/to/beads-workspace"
# beadsExecutable = "/absolute/path/to/bd"
# beadsDatabase = "project_database"
# verificationReadPaths = []
# [runtime.projects.source]
# url = "http://127.0.0.1:8080"
# projectId = "00000000-0000-4000-8000-000000000001"
# tokenFile = "/absolute/path/to/token"

# Optional worker capabilities for a configured profile. Standard uses that
# profile's worker model. Each task sets its own reasoning level.
# [profiles.personal.workerModels.fast]
# provider = "openai-codex"
# model = "your-fast-model"
# [profiles.personal.workerModels.advanced]
# provider = "openai-codex"
# model = "your-advanced-model"
