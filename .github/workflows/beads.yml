name: Studio Beads acceptance
# File-level filters keep unrelated workflows out of the runner queue.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/beads.yml'
      - 'scripts/ci-selection.ts'
      - 'tests/ci-selection.test.ts'
      - 'package.json'
      - 'bun.lock'
      - '.npmrc'
      - 'patches/**'
      - '*.ts'
      - '*.mjs'
      - 'execution/**'
      - 'tasks/**'
      - 'code-intelligence/**'
      - 'discovery/**'
      - 'documents/**'
      - 'diagram/**'
      - 'sessions/**'
      - 'socrates/**'
      - 'vendor/**'
      - 'resources/**'
      - 'generated/**'
      - 'zellij-revision'
      - 'scripts/studio'
      - 'scripts/pi'
      - 'scripts/runtime.mjs'
      - 'scripts/host-identity.mjs'
      - 'scripts/prepare-delegation.mjs'
      - 'acceptance/beads-control.ts'
      - 'acceptance/beads-fixture.ts'
      - 'acceptance/beads-http-fixture.ts'
      - 'acceptance/runtime-beads.ts'
      - 'acceptance/runtime-worker.ts'
      - 'acceptance/task-recovery.py'
      - 'acceptance/socrates_fixture.py'
      - 'acceptance/local_provider.py'
      - 'acceptance/task_panel_session.py'
      - 'acceptance/operator-decision.ts'
      - 'acceptance/operator-decision-ui.py'
      - 'acceptance/verification-control.ts'
      - 'acceptance/install-worktree-manager'
      - 'source-files.json'
      - '.gitattributes'
      - '.gitignore'
  pull_request:
    paths:
      - '.github/workflows/beads.yml'
      - 'scripts/ci-selection.ts'
      - 'tests/ci-selection.test.ts'
      - 'package.json'
      - 'bun.lock'
      - '.npmrc'
      - 'patches/**'
      - '*.ts'
      - '*.mjs'
      - 'execution/**'
      - 'tasks/**'
      - 'code-intelligence/**'
      - 'discovery/**'
      - 'documents/**'
      - 'diagram/**'
      - 'sessions/**'
      - 'socrates/**'
      - 'vendor/**'
      - 'resources/**'
      - 'generated/**'
      - 'zellij-revision'
      - 'scripts/studio'
      - 'scripts/pi'
      - 'scripts/runtime.mjs'
      - 'scripts/host-identity.mjs'
      - 'scripts/prepare-delegation.mjs'
      - 'acceptance/beads-control.ts'
      - 'acceptance/beads-fixture.ts'
      - 'acceptance/beads-http-fixture.ts'
      - 'acceptance/runtime-beads.ts'
      - 'acceptance/runtime-worker.ts'
      - 'acceptance/task-recovery.py'
      - 'acceptance/socrates_fixture.py'
      - 'acceptance/local_provider.py'
      - 'acceptance/task_panel_session.py'
      - 'acceptance/operator-decision.ts'
      - 'acceptance/operator-decision-ui.py'
      - 'acceptance/verification-control.ts'
      - 'acceptance/install-worktree-manager'
      - 'source-files.json'
      - '.gitattributes'
      - '.gitignore'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  beads-native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read the Bun minimum
        id: runtime
        run: python3 -c 'import json; print("bun=" + json.load(open("package.json"))["engines"]["bun"].removeprefix(">="))' >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.runtime.outputs.bun }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install verification isolation
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
      - name: Install acceptance worktree manager
        run: |
          HOME="$RUNNER_TEMP/manager" sh acceptance/install-worktree-manager 0.2.0
          echo "$RUNNER_TEMP/manager/.local/bin" >> "$GITHUB_PATH"
      - name: Install the pinned external Beads fixture
        run: |
          git clone --no-checkout https://github.com/lanej/dotfiles.git "$RUNNER_TEMP/dotfiles"
          git -C "$RUNNER_TEMP/dotfiles" checkout 9b4ea91344ec854c1463569e84b37ce12b1248ea -- bootstrap/tools.toml tools/beads config/beads
          python3 "$RUNNER_TEMP/dotfiles/tools/beads/beads-service.py" install --no-start
      - name: Install native terminal capture dependencies
        run: python3 -m pip install --disable-pip-version-check uv
      - name: Verify native admission and completion
        run: |
          manifest="$HOME/.local/share/beads-service/runtime.json"
          bun run test:beads-native -- \
            --bd "$(jq -er .bd "$manifest")" --dolt "$(jq -er .dolt "$manifest")"
          bun run test:runtime-beads-native -- \
            --bd "$(jq -er .bd "$manifest")" --dolt "$(jq -er .dolt "$manifest")"
          bun run test:runtime-worker-native -- \
            --bd "$(jq -er .bd "$manifest")" --dolt "$(jq -er .dolt "$manifest")"
          bun acceptance/operator-decision.ts \
            --bd "$(jq -er .bd "$manifest")" --dolt "$(jq -er .dolt "$manifest")" \
            --output "$RUNNER_TEMP/operator-decision"
