name: Studio checks
# File-level filters keep unrelated workflows out of the runner queue.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.typescript-quality.json'
      - '.typescript-quality/**'
      - '**/*.ts'
      - '**/*.mts'
      - '**/*.mjs'
      - '**/*.py'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - '.npmrc'
      - 'patches/**'
      - 'scripts/pi'
      - 'scripts/studio'
      - 'acceptance/install-worktree-manager'
      - 'acceptance/install-document-tools'
      - 'resources/**'
      - 'socrates/host.md'
      - 'vendor/**'
      - 'generated/**'
      - 'zellij-revision'
      - 'source-files.json'
      - '.gitattributes'
      - '.gitignore'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.typescript-quality.json'
      - '.typescript-quality/**'
      - '**/*.ts'
      - '**/*.mts'
      - '**/*.mjs'
      - '**/*.py'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - '.npmrc'
      - 'patches/**'
      - 'scripts/pi'
      - 'scripts/studio'
      - 'acceptance/install-worktree-manager'
      - 'acceptance/install-document-tools'
      - 'resources/**'
      - 'socrates/host.md'
      - 'vendor/**'
      - 'generated/**'
      - 'zellij-revision'
      - 'source-files.json'
      - '.gitattributes'
      - '.gitignore'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bun: minimum
          - os: macos-latest
            bun: minimum
          - os: ubuntu-latest
            bun: latest
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 25 || 15 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read the Bun minimum
        id: runtime
        run: python3 -c 'import json; print("bun=" + json.load(open("package.json"))["engines"]["bun"].removeprefix(">="))' >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun == 'latest' && 'latest' || steps.runtime.outputs.bun }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun install --cwd .typescript-quality --frozen-lockfile --ignore-scripts
      - name: Check shell entrypoints
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck bubblewrap
          shellcheck scripts/pi scripts/studio acceptance/install-worktree-manager acceptance/install-document-tools
      - run: bun run check
      - name: Verify native conversation interfaces
        run: |
          python3 -m pip install --disable-pip-version-check uv
          bun run test:socrates-ui
          uv run --script acceptance/session-loop.py
          uv run --script acceptance/diagram.py
      - run: bun run test:git-boundary-native
      - run: bun run test:verification-native
      - run: bun run test:pi-native
      - run: bun run check:beads-api
      - run: bun run check:zellij
      - name: Install acceptance worktree manager
        run: |
          HOME="$RUNNER_TEMP/manager" sh acceptance/install-worktree-manager 0.2.0
          echo "$RUNNER_TEMP/manager/.local/bin" >> "$GITHUB_PATH"
      - run: bun run test:standalone --with-integrations
  documents-native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read the Bun minimum
        id: runtime
        run: python3 -c 'import json; print("bun=" + json.load(open("package.json"))["engines"]["bun"].removeprefix(">="))' >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.runtime.outputs.bun }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/cache@v4
        id: terminal-tools
        with:
          path: ${{ runner.temp }}/studio-terminal-tools
          key: document-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('zellij-revision', 'acceptance/install-document-tools') }}
      - name: Install native build dependencies
        if: steps.terminal-tools.outputs.cache-hit != 'true'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y protobuf-compiler pkg-config libssl-dev cmake
          else
            brew install protobuf pkg-config
          fi
      - name: Install pinned terminal tools
        run: |
          bash acceptance/install-document-tools "$RUNNER_TEMP/studio-terminal-tools"
          echo "$RUNNER_TEMP/studio-terminal-tools/bin" >> "$GITHUB_PATH"
          python3 -m pip install --disable-pip-version-check uv
      - name: Verify the native document workflow
        run: |
          bun run test:documents-native -- --output "$RUNNER_TEMP/document-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/document-evidence
